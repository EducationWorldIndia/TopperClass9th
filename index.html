<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topper Study - BSEB</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>*{font-family:Inter,sans-serif}.display{font-family:'Plus Jakarta Sans',sans-serif}.glass{backdrop-filter:blur(20px)}</style>
</head>
<body class="bg-[#f8fafc] min-h-screen">
<!-- LOGIN -->
<div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/20 backdrop-blur-">
  <div id="loginCard" class="w-full max-w- bg-white rounded- p-8 shadow-2xl border">
    <div class="w-12 h-12 bg-slate-900 rounded-2xl flex items-center justify-center mx-auto">👑</div>
    <h1 class="display text- font-extrabold text-center mt-4">Topper Study</h1>
    <p class="text-center text- text-slate-500 font-medium">Bihar Board BSEB</p>
    <form onsubmit="doLogin(event)" class="mt-6">
      <input id="pinInput" type="password" placeholder="Enter PIN" class="w-full h- rounded-2xl border-2 border-slate-200 px-4 font-bold outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">
      <p id="loginErr" class="hidden mt-3 text- font-bold text-red-600 bg-red-50 border border-red-100 rounded-xl px-3 py-2">Incorrect PIN!</p>
      <button class="mt-4 w-full h- rounded-2xl bg-slate-900 text-white font-bold">Unlock →</button>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="sticky top-0 z-20 glass bg-white/80 border-b border-slate-200">
    <div class="max-w- mx-auto px-5 h- flex items-center justify-between">
      <div class="flex items-center gap-3"><div class="w-9 h-9 bg-slate-900 text-white rounded-xl flex items-center justify-center font-extrabold">T</div><div><h1 class="display font-extrabold leading-none">Topper Study</h1><p class="text- font-bold text-slate-500 tracking-widest">BSEB CLASS 9 • <span id="roleBadge" class="px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-700">ADMIN</span></p></div></div>
      <div class="flex items-center gap-2">
        <button id="addFolderBtn" onclick="openAddFolder()" class="hidden h-9 px-4 rounded-full bg-indigo-600 text-white text- font-bold">+ Folder</button>
        <button id="passMgrBtn" onclick="openPassManager()" class="hidden h-9 w-9 rounded-full bg-white border flex items-center justify-center">⚙️</button>
        <button onclick="logout()" class="h-9 px-4 rounded-full bg-white border text- font-semibold">Logout</button>
      </div>
    </div>
  </header>
  <main class="max-w- mx-auto px-5 py-7">
    <div id="breadcrumb" class="text- font-medium text-slate-500 mb-5"></div>
    <div id="view"></div>
  </main>
</div>

<!-- MODALS -->
<div id="modal" class="fixed inset-0 z-[60] hidden items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
  <div class="bg-white rounded- p-6 w-full max-w- shadow-2xl">
    <h3 id="modalTitle" class="display font-extrabold text-"></h3>
    <div id="modalBody" class="mt-4"></div>
  </div>
</div>

<div id="passModal" class="fixed inset-0 z-[70] hidden items-center justify-center p-4 bg-slate-900/50 backdrop-blur">
  <div class="bg-white rounded- p-6 w-full max-w- shadow-2xl max-h- overflow-auto">
    <h3 class="display font-extrabold text-">Password Manager</h3>
    <p class="text- text-slate-500 mt-1">PIN kahin app pe show nahi hoga, sirf tumhare paas rahega</p>
    <div class="mt-5 p-4 rounded-2xl bg-slate-50 border">
      <input id="newPassInput" placeholder="Naya PIN banao (ex: student123)" class="w-full h-11 rounded-xl border px-3 text- font-semibold">
      <div class="flex gap-2 mt-3"><select id="newRole" class="h-11 rounded-xl border px-3 text- font-bold"><option value="student">Student (Read Only)</option><option value="admin">Admin (Full Access)</option></select><button onclick="createPassword()" class="flex-1 h-11 rounded-xl bg-slate-900 text-white text- font-bold">Create PIN</button></div>
      <div id="folderChecks" class="mt-4 grid grid-cols-2 gap-2"></div>
    </div>
    <div id="passList" class="mt-5 space-y-2"></div>
    <button onclick="closePassManager()" class="mt-5 w-full h-11 rounded-xl bg-white border font-bold text-">Close</button>
  </div>
</div>

<script>
// === DEFAULT BSEB DATA ===
const DEFAULT_FOLDERS = [
  {id:'science', name:'Science', icon:'🚀', chapters:[
    {id:'s1', name:'Matter in Our Surroundings', videos:Array.from({length:10},(_,i)=>({id:'v'+Date.now()+i, title:`Lecture ${i+1}`, youtubeId:''}))},
    {id:'s2', name:'Is Matter Around Us Pure', videos:Array.from({length:10},(_,i)=>({id:'v'+Date.now()+i+10, title:`Lecture ${i+1}`, youtubeId:''}))},
    {id:'s3', name:'Atoms and Molecules', videos:Array.from({length:10},(_,i)=>({id:'v'+Date.now()+i+20, title:`Lecture ${i+1}`, youtubeId:''}))},
    {id:'s4', name:'Structure of Atom', videos:Array.from({length:10},(_,i)=>({id:'v'+Date.now()+i+30, title:`Lecture ${i+1}`, youtubeId:''}))},
  ]},
  {id:'physics', name:'Physics', icon:'⚡', chapters:[
    {id:'p1', name:'Motion', videos:Array.from({length:10},(_,i)=>({id:'p'+Date.now()+i, title:`Lecture ${i+1}`, youtubeId:''}))},
    {id:'p2', name:'Force and Laws', videos:Array.from({length:10},(_,i)=>({id:'p'+Date.now()+i+10, title:`Lecture ${i+1}`, youtubeId:''}))},
  ]},
  {id:'math', name:'Math', icon:'📐', chapters:[
    {id:'m1', name:'Number Systems', videos:Array.from({length:10},(_,i)=>({id:'m'+Date.now()+i, title:`Lecture ${i+1}`, youtubeId:''}))},
    {id:'m2', name:'Polynomials', videos:Array.from({length:10},(_,i)=>({id:'m'+Date.now()+i+10, title:`Lecture ${i+1}`, youtubeId:''}))},
  ]},
  {id:'sst', name:'SST', icon:'🌍', chapters:[
    {id:'sst1', name:'French Revolution', videos:Array.from({length:10},(_,i)=>({id:'sst'+Date.now()+i, title:`Lecture ${i+1}`, youtubeId:''}))},
  ]},
];

let folders = JSON.parse(localStorage.getItem('TOPPER_FOLDERS') || 'null') || DEFAULT_FOLDERS;
let passwords = JSON.parse(localStorage.getItem('TOPPER_PASSWORDS') || '[]');
let currentUser = null;
let nav = {folder:null, chapter:null};

function save(){ localStorage.setItem('TOPPER_FOLDERS', JSON.stringify(folders)); localStorage.setItem('TOPPER_PASSWORDS', JSON.stringify(passwords)); }

function doLogin(e){
  e.preventDefault();
  const pin = document.getElementById('pinInput').value.trim();
  if(pin==='9209250' || pin==='920920'){ currentUser={role:'admin', allowed:['all']}; sessionStorage.setItem('topper_auth', JSON.stringify(currentUser)); hideLogin(); return; }
  const found = passwords.find(p=>p.pass===pin);
  if(found){ currentUser=found; sessionStorage.setItem('topper_auth', JSON.stringify(currentUser)); hideLogin(); return; }
  document.getElementById('loginErr').classList.remove('hidden');
  document.getElementById('loginCard').classList.add('animate-pulse');
  setTimeout(()=>document.getElementById('loginCard').classList.remove('animate-pulse'),500);
}
function hideLogin(){ document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); initApp(); }
function logout(){ sessionStorage.removeItem('topper_auth'); location.reload(); }

function initApp(){
  currentUser = JSON.parse(sessionStorage.getItem('topper_auth'));
  document.getElementById('roleBadge').textContent = currentUser.role.toUpperCase();
  if(currentUser.role==='admin'){ document.getElementById('addFolderBtn').classList.remove('hidden'); document.getElementById('passMgrBtn').classList.remove('hidden'); }
  renderFolders();
}

function renderFolders(){
  nav={folder:null, chapter:null};
  document.getElementById('breadcrumb').innerHTML=`<span class="font-bold text-slate-900">Folders</span> <span class="text- ml-2">${currentUser.allowed[0]==='all'?'All Access':currentUser.allowed.length+' Folder Access'}</span>`;
  const allowed = currentUser.allowed[0]==='all'? folders : folders.filter(f=>currentUser.allowed.includes(f.id));
  document.getElementById('view').innerHTML=`<h2 class="display text- font-extrabold">Your Folders</h2>
  <div class="grid md:grid-cols-3 gap-5 mt-6">
  ${allowed.map(f=>`
    <div class="group relative bg-white border rounded- p-6 hover:shadow-lg transition-all">
      ${currentUser.role==='admin'?`<div class="absolute top-3 right-3 flex gap-1"><button onclick="renameFolder('${f.id}')" class="w-7 h-7 rounded-full bg-slate-50 border text-">✏️</button><button onclick="deleteFolder('${f.id}')" class="w-7 h-7 rounded-full bg-red-50 border text-">🗑️</button></div>`:''}
      <button onclick="openFolder('${f.id}')" class="text-left w-full"><div class="text-">${f.icon}</div><h3 class="display font-extrabold text- mt-3">${f.name}</h3><p class="text- text-slate-500 mt-1">${f.chapters.length} Chapters • ${f.chapters.reduce((a,c)=>a+c.videos.length,0)} Lectures</p></button>
    </div>`).join('')}
  </div>`;
}

function openFolder(id){
  const f = folders.find(x=>x.id===id);
  nav.folder=id; nav.chapter=null;
  document.getElementById('breadcrumb').innerHTML=`<button onclick="renderFolders()" class="hover:text-slate-900">Folders</button> › <span class="font-bold text-slate-900">${f.name}</span>`;
  document.getElementById('view').innerHTML=`<div class="flex items-center justify-between"><h2 class="display text- font-extrabold">${f.icon} ${f.name}</h2>${currentUser.role==='admin'?`<button onclick="addChapter('${f.id}')" class="h-9 px-4 rounded-full bg-slate-900 text-white text- font-bold">+ Chapter</button>`:''}</div>
  <div class="mt-6 space-y-3">
  ${f.chapters.map(ch=>`
    <div class="bg-white border rounded-2xl p-4 flex items-center justify-between">
      <button onclick="openChapter('${f.id}','${ch.id}')" class="text-left flex-1"><h3 class="font-bold text-">${ch.name}</h3><p class="text- text-slate-500">${ch.videos.filter(v=>v.youtubeId).length}/10 Videos Added</p></button>
      ${currentUser.role==='admin'?`<div class="flex gap-1"><button onclick="renameChapter('${f.id}','${ch.id}')" class="w-8 h-8 rounded-full bg-slate-50 border">✏️</button><button onclick="deleteChapter('${f.id}','${ch.id}')" class="w-8 h-8 rounded-full bg-red-50 border">🗑️</button></div>`:''}
    </div>`).join('')}
  </div>`;
}

function openChapter(folderId, chapterId){
  const f = folders.find(x=>x.id===folderId); const ch = f.chapters.find(c=>c.id===chapterId);
  nav.chapter=chapterId;
  document.getElementById('breadcrumb').innerHTML=`<button onclick="renderFolders()">Folders</button> › <button onclick="openFolder('${folderId}')">${f.name}</button> › <span class="font-bold text-slate-900">${ch.name}</span>`;
  document.getElementById('view').innerHTML=`<div class="flex items-center justify-between"><h2 class="display text- font-extrabold">${ch.name} - Lecture 1 to 10</h2><button onclick="openFolder('${folderId}')" class="h-8 px-3 rounded-full bg-white border text- font-semibold">← Back</button></div>
  <div class="grid md:grid-cols-2 gap-5 mt-6">
  ${ch.videos.map((v,i)=> v.youtubeId? `
    <div class="bg-white border rounded- overflow-hidden shadow-sm">
      <div class="aspect-video bg-black"><iframe class="w-full h-full" src="https://www.youtube.com/embed/${v.youtubeId}" allowfullscreen></iframe></div>
      <div class="p-4 flex items-center justify-between"><div class="flex gap-2"><div class="w-7 h-7 rounded-full bg-slate-900 text-white flex items-center justify-center text- font-bold">${i+1}</div><p class="font-semibold text-">${v.title}</p></div>${currentUser.role==='admin'?`<div class="flex gap-1"><button onclick="renameVideo('${folderId}','${chapterId}','${v.id}')" class="w-7 h-7 rounded-full bg-slate-50 border text-">✏️</button><button onclick="deleteVideo('${folderId}','${chapterId}','${v.id}')" class="w-7 h-7 rounded-full bg-red-50 border text-">🗑️</button></div>`:''}</div>
    </div>` : `
    <div class="rounded- border-2 border-dashed border-slate-300 bg-slate-50 p-6 flex flex-col items-center justify-center min-h-">
      <p class="font-bold text-">Lecture ${i+1} - Empty</p>
      ${currentUser.role==='admin'?`<button onclick="addVideo('${folderId}','${chapterId}','${v.id}')" class="mt-3 h-9 px-4 rounded-full bg-slate-900 text-white text- font-bold">+ Add Link</button>`:`<p class="text- text-slate-400 mt-2">Admin will add soon</p>`}
    </div>`).join('')}
  </div>`;
}

// ADMIN ACTIONS
function openAddFolder(){ showModal('Add New Folder', `<input id="fName" placeholder="Folder Name (ex: Books)" class="w-full h-11 rounded-xl border px-3"><input id="fIcon" placeholder="Icon (ex: 📚)" class="w-full h-11 rounded-xl border px-3 mt-3"><button onclick="saveFolder()" class="mt-4 w-full h-11 rounded-xl bg-slate-900 text-white font-bold">Create Folder</button>`); }
function saveFolder(){ const name=document.getElementById('fName').value, icon=document.getElementById('fIcon').value||'📁'; if(!name) return; folders.push({id:'f'+Date.now(), name, icon, chapters:[]}); save(); closeModal(); renderFolders(); }
function renameFolder(id){ const f=folders.find(x=>x.id===id); showModal('Rename Folder', `<input id="fName" value="${f.name}" class="w-full h-11 rounded-xl border px-3"><button onclick="doRenameFolder('${id}')" class="mt-4 w-full h-11 rounded-xl bg-slate-900 text-white font-bold">Rename</button>`); }
function doRenameFolder(id){ folders.find(x=>x.id===id).name=document.getElementById('fName').value; save(); closeModal(); renderFolders(); }
function deleteFolder(id){ if(!confirm('Delete this folder permanently?')) return; folders=folders.filter(x=>x.id!==id); save(); renderFolders(); }
function addChapter(fid){ showModal('Add Chapter', `<input id="cName" placeholder="Chapter Name" class="w-full h-11 rounded-xl border px-3"><button onclick="doAddChapter('${fid}')" class="mt-4 w-full h-11 rounded-xl bg-slate-900 text-white font-bold">Add</button>`); }
function doAddChapter(fid){ const name=document.getElementById('cName').value; folders.find(x=>x.id===fid).chapters.push({id:'c'+Date.now(), name, videos:Array.from({length:10},(_,i)=>({id:'v'+Date.now()+i, title:`Lecture ${i+1}`, youtubeId:''}))}); save(); closeModal(); openFolder(fid); }
function renameChapter(fid,cid){ const ch=folders.find(x=>x.id===fid).chapters.find(c=>c.id===cid); showModal('Rename Chapter', `<input id="cName" value="${ch.name}" class="w-full h-11 rounded-xl border px-3"><button onclick="doRenameChapter('${fid}','${cid}')" class="mt-4 w-full h-11 rounded-xl bg-slate-900 text-white font-bold">Rename</button>`); }
function doRenameChapter(fid,cid){ folders.find(x=>x.id===fid).chapters.find(c=>c.id===cid).name=document.getElementById('cName').value; save(); closeModal(); openFolder(fid); }
function deleteChapter(fid,cid){ if(!confirm('Delete chapter?')) return; const f=folders.find(x=>x.id===fid); f.chapters=f.chapters.filter(c=>c.id!==cid); save(); openFolder(fid); }
function addVideo(fid,cid,vid){ showModal('Add Lecture Link', `<input id="vTitle" placeholder="Lecture Title" class="w-full h-11 rounded-xl border px-3"><input id="vLink" placeholder="Paste YouTube Link" class="w-full h-11 rounded-xl border px-3 mt-3"><button onclick="doAddVideo('${fid}','${cid}','${vid}')" class="mt-4 w-full h-11 rounded-xl bg-slate-900 text-white font-bold">Save Permanently</button><p class="text- text-slate-500 mt-2">View Source me link nahi dikhega, localStorage me save hoga</p>`); }
function doAddVideo(fid,cid,vid){ const title=document.getElementById('vTitle').value||'Lecture'; const link=document.getElementById('vLink').value; const m=link.match(/(?:youtube\.com.*v=|youtu\.be\/)([^&?]+)/); const yid=m?m[1]:link; const v=folders.find(x=>x.id===fid).chapters.find(c=>c.id===cid).videos.find(v=>v.id===vid); v.title=title; v.youtubeId=yid; save(); closeModal(); openChapter(fid,cid); }
function renameVideo(fid,cid,vid){ const v=folders.find(x=>x.id===fid).chapters.find(c=>c.id===cid).videos.find(x=>x.id===vid); showModal('Rename / Edit Video', `<input id="vTitle" value="${v.title}" class="w-full h-11 rounded-xl border px-3"><input id="vLink" value="https://youtu.be/${v.youtubeId}" class="w-full h-11 rounded-xl border px-3 mt-3"><button onclick="doAddVideo('${fid}','${cid}','${vid}')" class="mt-4 w-full h-11 rounded-xl bg-slate-900 text-white font-bold">Update</button>`); }
function deleteVideo(fid,cid,vid){ if(!confirm('Delete video?')) return; const vids=folders.find(x=>x.id===fid).chapters.find(c=>c.id===cid).videos; const v=vids.find(x=>x.id===vid); v.title=`Lecture ${vids.indexOf(v)+1}`; v.youtubeId=''; save(); openChapter(fid,cid); }

// PASSWORD MANAGER
function openPassManager(){
  document.getElementById('passModal').classList.remove('hidden'); document.getElementById('passModal').classList.add('flex');
  renderPassChecks(); renderPassList();
}
function closePassManager(){ document.getElementById('passModal').classList.add('hidden'); }
function renderPassChecks(){ document.getElementById('folderChecks').innerHTML=folders.map(f=>`<label class="flex items-center gap-2 text- font-medium"><input type="checkbox" value="${f.id}" class="fCheck"> ${f.icon} ${f.name}</label>`).join('') + `<label class="flex items-center gap-2 text- font-bold"><input type="checkbox" id="checkAll" onchange="document.querySelectorAll('.fCheck').forEach(c=>c.checked=this.checked)"> Select All</label>`; }
function createPassword(){ const pass=document.getElementById('newPassInput').value.trim(); const role=document.getElementById('newRole').value; const allowed=Array.from(document.querySelectorAll('.fCheck:checked')).map(c=>c.value); if(!pass) return alert('PIN daalo'); if(allowed.length===0 &&!document.getElementById('checkAll').checked) return alert('Folder select karo'); passwords.push({pass, role, allowed: document.getElementById('checkAll').checked?['all']:allowed}); save(); document.getElementById('newPassInput').value=''; renderPassList(); alert('PIN Created! Ab isko kisi ko de sakte ho'); }
function renderPassList(){ document.getElementById('passList').innerHTML=passwords.map((p,i)=>`<div class="flex items-center justify-between p-3 rounded-xl border bg-white"><div><p class="font-bold text-">${'•'.repeat(p.pass.length)} <span class="text- text-slate-500">(${p.role})</span></p><p class="text- text-slate-500">${p.allowed[0]==='all'?'All Folders':p.allowed.join(', ')}</p></div><div class="flex gap-1"><button onclick="navigator.clipboard.writeText('${p.pass}'); alert('Copied!')" class="w-7 h-7 rounded-full bg-slate-100 border text-">📋</button><button onclick="passwords.splice(${i},1); save(); renderPassList();" class="w-7 h-7 rounded-full bg-red-50 border text-">🗑️</button></div></div>`).join('') || '<p class="text- text-slate-400">No custom PINs yet</p>'; }

function showModal(title, body){ document.getElementById('modalTitle').innerText=title; document.getElementById('modalBody').innerHTML=body; document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('flex'); }
function closeModal(){ document.getElementById('modal').classList.add('hidden'); }
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });

// INIT
(function(){ const auth=sessionStorage.getItem('topper_auth'); if(auth){ currentUser=JSON.parse(auth); document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); initApp(); } })();
</script>
</body>
</html>
